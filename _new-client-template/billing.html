<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Billing</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<!-- Change ./core/ to your biryani-core GitHub Pages URL for production -->
<link rel="stylesheet" href="./core/billing.css"/>
</head>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-logo">&#129534; Billing</div>
    <span class="status-pill loading" id="statusPill">LOADING</span>
    <button class="btn-open-holds" id="openBillsBtn" onclick="openHeldBillsModal()">Open Bills (0)</button>
    <input class="shop-input" id="shopInput" type="text" value="" placeholder="Shop name..." oninput="syncShop()"/>
    <button class="btn-reload" id="reloadBtn" onclick="reloadSheet()" title="Reload menu from sheet">&#8635; Reload</button>
    <button class="btn-lock" onclick="lockScreen()">&#128274;</button>
  </div>

  <div class="mobile-tabs" id="mobileTabs">
    <div class="mtab" id="tabProducts" onclick="switchTab('products')">&#127919; Add Item</div>
    <div class="mtab on" id="tabBill" onclick="switchTab('bill')">&#129534; Bill <span class="cart-badge" id="cartBadge">0</span></div>
  </div>

  <div class="main-area">
    <!-- Products Panel -->
    <div class="panel-products" id="panelProducts">
      <div class="cat-strip">
        <div class="cat-strip-title">Dish Filters</div>
        <div class="cat-bar" id="catBar"></div>
      </div>
      <div class="quick-add-wrap">
        <div class="quick-head">
          <div class="quick-title">Quick Dish Add</div>
          <button class="quick-close" type="button" onclick="closeQuickList()" title="Close search list">✕</button>
        </div>
        <div class="quick-row">
          <input class="quick-search" type="text" id="searchInput" placeholder="Type 2-3 letters of dish name..." oninput="renderProducts()" onclick="renderProducts()" onfocus="renderProducts()" onkeydown="handleQuickKey(event)" autocomplete="off"/>
          <input class="quick-qty" type="number" id="quickQty" min="1" value="1" onkeydown="handleQuickQtyKey(event)"/>
          <button class="quick-btn" onclick="addSelectedQuickItem()">ADD</button>
        </div>
        <div class="quick-list" id="quickList"></div>
      </div>
      <div class="left-line-items" id="leftLineItems">
        <div class="left-empty">Add dishes from quick search to see bill items here</div>
      </div>
      <div class="custom-form">
        <div class="custom-form-title">&#43; Add Custom Item</div>
        <div class="custom-form-row">
          <input class="inp-name" type="text" id="customName" placeholder="Item name..." />
          <input class="inp-price" type="number" id="customPrice" placeholder="&#8377; Price" min="0"/>
          <button class="btn-custom-add" onclick="addCustomItem()">ADD</button>
        </div>
      </div>
    </div>

    <!-- Bill Panel -->
    <div class="panel-bill hidden" id="panelBill">
      <div class="bill-hdr">
        <div class="shop-name" id="billShop"></div>
        <div class="meta-row">
          <span class="bm" id="billNum">Bill #0001</span>
          <span class="bm" id="billDate"></span>
        </div>
      </div>
      <div class="print-customer" id="printCustomerMeta"></div>
      <div class="print-dishes" id="printDishList"></div>
      <div class="cust-row">
        <label>Type</label>
        <select id="custType" onchange="updateSummary()" style="background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
          color:#fff;padding:6px 8px;border-radius:6px;font-size:.82rem;outline:none;cursor:pointer;
          font-family:'DM Sans',sans-serif;font-weight:600;">
          <option value="Walk-in"  style="background:#180900">🚶 Walk-in</option>
          <option value="Online"   style="background:#180900">🌐 Online</option>
        </select>
        <label>Customer</label>
        <input type="text" id="custInput" placeholder="Customer name..." style="max-width:130px;"/>
        <label>📱 +91</label>
        <input type="tel" id="custPhone" maxlength="10" placeholder="WhatsApp no."
          style="max-width:110px;" oninput="this.value=this.value.replace(/[^0-9]/g,'')"/>
        <label>🍽️ Table</label>
        <input type="text" id="tableNo" placeholder="Optional"
          style="max-width:90px;"/>
        <label>💳</label>
        <select id="payMode" onchange="updateSummary()" style="background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
          color:#fff;padding:6px 8px;border-radius:6px;font-size:.82rem;outline:none;cursor:pointer;font-family:'DM Sans',sans-serif;">
          <option value="UPI"       style="background:#180900">💸 UPI</option>
          <option value="Cash"      style="background:#180900">💵 Cash</option>
          <option value="Google Pay" style="background:#180900">G GPay</option>
          <option value="PhonePe"   style="background:#180900">P PhonePe</option>
          <option value="Card"      style="background:#180900">💳 Card</option>
          <option value="Other"     style="background:#180900">🏦 Other</option>
        </select>
      </div>
      <div class="cust-row" style="border-bottom:1px solid rgba(255,255,255,.08);">
        <label>📍 Address</label>
        <input type="text" id="custAddress" placeholder="Delivery address (optional)" style="flex:1;"/>
      </div>
      <div class="line-items" id="lineItems">
        <div class="bill-empty"><div style="font-size:2.2rem;margin-bottom:10px">&#127869;&#65039;</div><p>Use Add Item search to add dishes quickly</p></div>
      </div>
      <div class="summary">
        <div class="sum-ctrl-row">
          <div class="sum-ctrl">
            <label>GST %</label>
            <input type="number" id="gstRate" value="0" min="0" max="100" oninput="updateSummary()"/>
          </div>
          <div class="sum-ctrl">
            <label>Discount</label>
            <input type="number" id="discountVal" value="0" min="0" oninput="updateSummary()"/>
            <select id="discountType" onchange="updateSummary()">
              <option value="flat">&#8377;</option>
              <option value="pct">%</option>
            </select>
          </div>
        </div>
        <div class="srow"><span>Subtotal</span><span id="subVal">&#8377;0.00</span></div>
        <div class="srow"><span id="gstLbl">GST (5%)</span><span id="gstVal">&#8377;0.00</span></div>
        <div class="srow sdiscount"><span id="discLbl">Discount</span><span id="discAmt">-&#8377;0.00</span></div>
        <div class="srow" id="payModeRow"><span>Payment</span><span id="payModeDisplay" style="color:var(--gold2);">💸 UPI</span></div>
        <div class="srow stotal"><span>TOTAL</span><span id="totalVal">&#8377;0.00</span></div>
      </div>
      <div class="actions">
        <button class="btn-clear" onclick="clearBill()">&#128465;</button>
        <button class="btn-print" onclick="printBill()" title="Print Bill">&#128424; Print</button>
        <button class="btn-dl-bill" onclick="downloadBillImg()" title="Download Bill Image">📥 Image</button>
        <button class="btn-hold-order" id="holdOrderBtn" onclick="holdOrder()">⏸ Hold</button>
        <button class="btn-wa-bill" id="waBillBtn" onclick="sendWaBill()">
          <svg width="15" height="15" fill="#fff" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.126.549 4.126 1.51 5.868L0 24l6.29-1.49A11.945 11.945 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 01-5.032-1.384l-.36-.214-3.733.883.899-3.647-.234-.375A9.818 9.818 0 1112 21.818z"/></svg>
          <span id="waBtnTxt">WhatsApp</span>
        </button>
        <button class="btn-close-order" id="closeOrderBtn" onclick="closeOrder()">&#10003; Close</button>
      </div>
    </div>
  </div>

  <!-- Floating cart button (mobile) -->
  <div class="mobile-cart-bar">
    <button class="mcart-btn hidden" id="mCartBtn" onclick="switchTab('bill')">
      <span>View Bill &nbsp;<span class="mcart-count" id="mCartCount">0 items</span></span>
      <div class="mcart-right"><span id="mCartTotal">&#8377;0.00</span> &#8594;</div>
    </button>
  </div>
</div>

<div class="modal-bg" id="heldBillsModal">
  <div class="hold-modal">
    <div class="hold-hdr">
      <div class="hold-title">Open / Held Bills</div>
      <div class="hold-sp"></div>
      <button class="hold-close" onclick="closeHeldBillsModal()">✕</button>
    </div>
    <div class="hold-tools">
      <input id="heldSearch" type="text" placeholder="Search bill no, customer, phone, table..." oninput="renderHeldBillsList()"/>
      <button class="btn-reload" onclick="refreshHeldBills()">⟳ Refresh</button>
    </div>
    <div class="hold-list" id="heldBillsList">
      <div class="hold-empty">No held bills</div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="./core/billing.js"></script>
</body>
</html>
