<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mental Ladder 🪜</title>
<link rel="stylesheet" href="../assets/style.css">
</head><body class="game-bg">
<div class="game-wrap">
  <div class="top-bar">
    <a href="../index.html" class="back">← Hub</a>
    <h1 class="game-title">🪜 Mental Math Ladder</h1>
    <a href="leaderboard.html" class="back">🏆 Board</a>
  </div>

  <div style="text-align:center;margin-bottom:14px">
    <input class="name-edit" id="pname" value="Player" maxlength="20">
  </div>

  <div class="timer-bar">
    <span>📈 Lvl <b id="lvl">1</b></span>
    <span>❤️ <b id="lives">3</b></span>
    <span>⭐ <b id="score">0</b></span>
  </div>

  <div class="solo-q" id="q">Press Start</div>

  <!-- 🪜 Climbing Ladder -->
  <div class="ladder">
    <div class="ladder-sun">☀️</div>
    <div class="ladder-cloud">☁️</div>
    <div class="ladder-flag">🚩</div>
    <div class="ladder-rails" id="rails"></div>
    <div class="ladder-climber" id="climber">🧗</div>
    <div class="ladder-level-text">Level <span id="lvlTxt">1</span> / 10</div>
  </div>

  <div class="numpad" id="pad" style="margin-bottom:18px"></div>

  <div class="controls">
    <button class="btn btn-primary" id="startBtn" onclick="start()">▶ Start Climbing</button>
    <button class="btn btn-secondary" onclick="resetGame()">↺ Reset</button>
  </div>
</div>

<div id="endC" class="overlay hidden">
  <div class="overlay-card">
    <h1 id="endTitle">💀 Game Over</h1>
    <div class="big" id="endScore">0</div>
    <p id="endMsg">Final Score</p>
    <button class="btn btn-primary" onclick="resetGame()">Try Again</button>
    <a href="leaderboard.html" class="btn btn-secondary" style="text-decoration:none;display:inline-block">View Board</a>
  </div>
</div>

<script src="../assets/game.js"></script>
<script>
let lvl=1,lives=3,score=0,cur=null,playing=false;
const $=id=>document.getElementById(id);

// Build ladder rungs once
const MAX_LVL = 10;
(function buildRungs(){
  const rails = $('rails');
  for(let i=0;i<MAX_LVL;i++){
    const r = document.createElement('div');
    r.className = 'ladder-rung';
    r.style.bottom = (i*28 + 10) + 'px';
    rails.appendChild(r);
  }
})();
function moveClimber(){
  const idx = Math.min(lvl-1, MAX_LVL-1);
  $('climber').style.bottom = (idx*28 + 70) + 'px';
  $('lvlTxt').textContent = lvl;
  if(lvl>=MAX_LVL){ $('climber').textContent = '🏆'; }
  else { $('climber').textContent = '🧗'; }
}

const pad = buildNumpad($('pad'), v=>{
  if(!playing||!cur) return;
  if(v===cur.ans){
    score += lvl*10;
    lvl++; ok(); update(); moveClimber();
    if(lvl>MAX_LVL){ endWin(); return; }
    next();
  } else {
    lives--; bad(); update();
    if(lives<=0) end();
  }
});

function diffFor(l){
  if(l<=3) return 'easy';
  if(l<=7) return 'medium';
  return 'hard';
}
function start(){
  lvl=1;lives=3;score=0;playing=true;
  update();
  moveClimber();
  $('startBtn').textContent='Playing...';
  next();
}
function update(){
  $('lvl').textContent=lvl; $('lives').textContent=lives; $('score').textContent=score;
}
function next(){
  cur = Q[diffFor(lvl)]();
  $('q').textContent = cur.text + ' = ?';
  pad.clear();
}
function end(){
  playing=false;
  $('startBtn').textContent='▶ Start Climbing';
  $('endTitle').textContent='💀 Game Over';
  $('endScore').textContent = score;
  $('endMsg').textContent = `Reached Level ${lvl}`;
  $('endC').classList.remove('hidden');
  bad();
  const name = $('pname').value || 'Player';
  lbAdd({game:'Mental Ladder', name, score, detail:`Level ${lvl}`});
}
function endWin(){
  playing=false;
  $('startBtn').textContent='▶ Start Climbing';
  $('endTitle').textContent='🏆 Top of the Ladder!';
  $('endScore').textContent = score;
  $('endMsg').textContent = `Cleared all ${MAX_LVL} levels!`;
  $('endC').classList.remove('hidden');
  win();
  const name = $('pname').value || 'Player';
  lbAdd({game:'Mental Ladder', name, score, detail:`🏆 Cleared ${MAX_LVL} levels`});
}
function resetGame(){
  playing=false; cur=null;
  lvl=1;lives=3;score=0;
  update();
  moveClimber();
  $('q').textContent='Press Start';
  pad.clear();
  $('startBtn').textContent='▶ Start Climbing';
  $('endC').classList.add('hidden');
}
moveClimber();
</script>
</body></html>
